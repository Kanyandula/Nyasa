plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
    id 'dagger.hilt.android.plugin'
    id 'io.gitlab.arturbosch.detekt'
    id 'com.diffplug.spotless'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.kanyandula.nyasa"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    ksp {
        arg("room.schemaLocation", "$projectDir/schemas".toString())
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }
    lint {
        abortOnError false
        warningsAsErrors false
        htmlReport true
        htmlOutput file("${project.buildDir}/reports/lint/lint-results.html")
        xmlReport true
        xmlOutput file("${project.buildDir}/reports/lint/lint-results.xml")
        lintConfig file("lint.xml")
        checkDependencies false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    namespace 'com.kanyandula.nyasa'
}

detekt {
    buildUponDefaultConfig = true
    config.setFrom(files("${rootProject.projectDir}/detekt.yml"))
    source.setFrom(files(
        "src/main/java",
        "src/main/kotlin"
    ))
    reports {
        html {
            required.set(true)
            outputLocation.set(file("${project.buildDir}/reports/detekt/detekt.html"))
        }
        xml {
            required.set(true)
            outputLocation.set(file("${project.buildDir}/reports/detekt/detekt.xml"))
        }
    }
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    jvmTarget = "17"
}
tasks.withType(io.gitlab.arturbosch.detekt.DetektCreateBaselineTask).configureEach {
    jvmTarget = "17"
}

spotless {
    kotlin {
        target '**/*.kt'
        targetExclude '**/build/**'
        ktlint('0.48.2')
            .editorConfigOverride([
                'ktlint_code_style'              : 'android_studio',
                'max_line_length'                : '120',
                'ktlint_standard_no-wildcard-imports': 'disabled',
                'ktlint_standard_max-line-length'    : 'disabled',
                'ktlint_standard_package-name'       : 'disabled',
            ])
        trimTrailingWhitespace()
        endWithNewline()
    }
    kotlinGradle {
        target '**/*.gradle.kts'
        ktlint('0.48.2')
    }
}

dependencies {

    // Core modules
    implementation project(':core:common')
    implementation project(':core:designsystem')
    implementation project(':core:network')
    implementation project(':core:database')
    implementation project(':core:domain')
    implementation project(':core:session')
    implementation project(':core:data')
    implementation project(':core:work')

    // WorkManager (for Configuration.Provider wiring + observing WorkInfo from UI)
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    ksp 'androidx.hilt:hilt-compiler:1.2.0'

    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Compose
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-text-google-fonts'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation 'androidx.paging:paging-compose:3.3.6'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Coil (Compose-native image loading)
    implementation 'io.coil-kt.coil3:coil-compose:3.0.4'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.0.4'

    // Rich text editor (replaces markdown round-trip approach)
    implementation 'com.mohamedrejeb.richeditor:richeditor-compose:1.0.0-rc11'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"

    // Room
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    implementation "androidx.room:room-paging:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"

    // Paging 3
    implementation "androidx.paging:paging-runtime:3.3.6"

    // Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-compiler:$hilt_version"
    kspAndroidTest "com.google.dagger:hilt-android-compiler:$hilt_version"

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Retrofit + kotlinx-serialization
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter:1.0.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.8.0')
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-perf-ktx'

    // Timber
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Image Picker + Cropper
    implementation "com.github.Drjacky:ImagePicker:2.3.22"

    // Image Compression
    implementation "id.zelory:compressor:3.0.1"

    // HTML parsing
    implementation 'org.jsoup:jsoup:1.18.3'

    // Encrypted SharedPreferences
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // Unit Tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation "com.google.truth:truth:1.4.4"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "app.cash.turbine:turbine:1.1.0"
    testImplementation "io.mockk:mockk:1.13.12"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"
    testImplementation "androidx.room:room-testing:2.6.1"
    testImplementation "androidx.paging:paging-testing:3.3.6"

    // Instrumented Tests
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"
    androidTestImplementation "com.google.truth:truth:1.4.4"
    androidTestImplementation "app.cash.turbine:turbine:1.1.0"
    androidTestImplementation "io.mockk:mockk-android:1.13.12"
    androidTestImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
