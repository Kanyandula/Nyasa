plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs'
    id 'dagger.hilt.android.plugin'
    id 'io.gitlab.arturbosch.detekt'
    id 'com.diffplug.spotless'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.kanyandula.nyasa"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    ksp {
        arg("room.schemaLocation", "$projectDir/schemas".toString())
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
    }
    lint {
        abortOnError false
        warningsAsErrors false
        htmlReport true
        htmlOutput file("${project.buildDir}/reports/lint/lint-results.html")
        xmlReport true
        xmlOutput file("${project.buildDir}/reports/lint/lint-results.xml")
        lintConfig file("lint.xml")
        checkDependencies false
    }

    namespace 'com.kanyandula.nyasa'
}

detekt {
    buildUponDefaultConfig = true
    config.setFrom(files("${rootProject.projectDir}/detekt.yml"))
    source.setFrom(files(
        "src/main/java",
        "src/main/kotlin"
    ))
    reports {
        html {
            required.set(true)
            outputLocation.set(file("${project.buildDir}/reports/detekt/detekt.html"))
        }
        xml {
            required.set(true)
            outputLocation.set(file("${project.buildDir}/reports/detekt/detekt.xml"))
        }
    }
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    jvmTarget = "17"
}
tasks.withType(io.gitlab.arturbosch.detekt.DetektCreateBaselineTask).configureEach {
    jvmTarget = "17"
}

spotless {
    kotlin {
        target '**/*.kt'
        targetExclude '**/build/**'
        ktlint('0.48.2')
            .editorConfigOverride([
                'ktlint_code_style'              : 'android_studio',
                'max_line_length'                : '120',
                'ktlint_standard_no-wildcard-imports': 'disabled',
                'ktlint_standard_max-line-length'    : 'disabled',
                'ktlint_standard_package-name'       : 'disabled',
            ])
        trimTrailingWhitespace()
        endWithNewline()
    }
    kotlinGradle {
        target '**/*.gradle.kts'
        ktlint('0.48.2')
    }
}

dependencies {

    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'

    // Compose
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-text-google-fonts'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation 'androidx.paging:paging-compose:3.3.6'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Coil (Compose-native image loading)
    implementation 'io.coil-kt.coil3:coil-compose:3.0.4'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.0.4'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.6"

    // Room
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    implementation "androidx.room:room-paging:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"

    // Paging 3
    implementation "androidx.paging:paging-runtime:3.3.6"

    // Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-compiler:$hilt_version"
    kspAndroidTest "com.google.dagger:hilt-android-compiler:$hilt_version"

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Retrofit + GSON
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // Glide (kept during transition, replaced by Coil in Phase E)
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Image Picker + Cropper
    implementation "com.github.Drjacky:ImagePicker:2.3.22"

    // Image Compress
    implementation 'id.zelory:compressor:3.0.1'

    // UI
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "com.afollestad.material-dialogs:core:3.3.0"

    // Encrypted SharedPreferences
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Unit Tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation "com.google.truth:truth:1.4.4"

    // Instrumented Tests
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"
    androidTestImplementation "com.google.truth:truth:1.4.4"
}
